# Builds the server bundle and images, reusing the unmodified official desktop and ccdt release files.
# This is where a release is built: a vX.Y.Z tag creates a draft and publishes it after every job succeeds. Manual runs may name
# an existing draft in `release`; otherwise the files stay with the run for 3 days. Nothing is signed with a certificate.
name: package
on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag of a draft release to attach the files to. Left empty, they stay with the run.
        default: ''
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/release.mjs --dry-run
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release }}
        run: |
          tag="$REQUESTED"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -z "$tag" ]]; then exit 0; fi
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$tag" = "v$version"
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo 'Published releases are immutable.' >&2; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "CC Desk Tunnel $version" --notes-file artifacts/release/notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  # The server image of the release, for amd64 and arm64 (see images.yml).
  images:
    needs: prepare
    if: needs.prepare.outputs.release != ''
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.prepare.outputs.release }}
  # Clients are the upstream release files, verified against upstream hashes and copied without rebuilding.
  clients:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify client sources match the official tag
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          git fetch --depth=1 https://github.com/sun168567/cc-desk-tunnel.git "refs/tags/v$version"
          git diff --exit-code FETCH_HEAD -- apps/desktop apps/cli packages/protocol
      - run: node scripts/fetch-official-clients.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: official-clients
          path: artifacts/official-clients/*
          if-no-files-found: error
          retention-days: 3
  server:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --include=dev --workspace=@cc-desk-tunnel/desktop --workspace=@cc-desk-tunnel/protocol
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          mkdir -p artifacts/server
          node scripts/package-server.mjs "artifacts/server/cc-desk-tunnel-server-$version.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: artifacts/server/*.tar.gz
          if-no-files-found: error
          retention-days: 3
  # For the release script: every file of the release goes from here to the draft it made, described by
  # release.json and SHA256SUMS, without passing through a maintainer's computer. The only job that may
  # write to the repository.
  attach:
    if: needs.prepare.outputs.release != ''
    needs: [prepare, clients, server, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --event push --commit "$GITHUB_SHA" --json status,conclusion --limit 1)"
            state="$(printf '%s' "$run" | jq -r '.[0].status // "missing"')"
            result="$(printf '%s' "$run" | jq -r '.[0].conclusion // ""')"
            if [[ "$state" == completed ]]; then
              test "$result" = success || { echo "Main checks: $result" >&2; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo 'Main checks have not completed successfully; the release stays a draft.' >&2
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: '{official-clients,server}'
          merge-multiple: true
          path: downloaded
      - run: |
          mkdir release
          mv downloaded/*.exe downloaded/*.dmg downloaded/*.deb downloaded/*.tar.gz downloaded/ccdt-*.zip release/
          node scripts/release-manifest.mjs release
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release }}
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release }}
  promote:
    if: startsWith(github.ref, 'refs/tags/')
    needs: attach
    uses: ./.github/workflows/image-latest.yml
    permissions:
      contents: read
      packages: write
